<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Oufy">
  <title>Oufy</title>
  <!-- No logo mark exists for Oufy (see DESIGN_SYSTEM.md §13): the brand is the
       wordmark. This icon is the wordmark's initial on the CTA gradient — typographic,
       not an invented symbol. SVG favicons do not load webfonts, so the stack falls
       back to a grotesque, which matches Jakarta's proportions closely enough at 16px. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5C2C"/>
      <stop offset="1" stop-color="#6B4C38"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <text x="32" y="44.5" text-anchor="middle"
        font-family="'Plus Jakarta Sans', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="800" fill="#FFF8F4">O</text>
</svg>
