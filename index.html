<!-- ════════════════════════════════════════════════════════════════════════════════
     The whole page lives in the inline script below, on purpose.

     Babel standalone fetches an external `type="text/babel" src="…"` file over XHR,
     and XHR is blocked on the file:// protocol — so a separate-file version of this
     page renders blank when opened by double-clicking, and only works behind a server.
     Inline script has nothing to fetch, so this file works both ways. It also removes
     the hand-maintained ?v= cache-buster the three files used to need to stay in sync.

     Order: config → hooks → primitives → sections → mount.
     ════════════════════════════════════════════════════════════════════════════════ -->
<script type="text/babel" data-presets="react">

/* ═══ Config ═══════════════════════════════════════════════════════════════════ */

/* The single place to wire the store link. While it is empty the "Get the app"
   buttons scroll to the closing section instead of navigating; set it to the store
   URL and they become real links. See DEPLOYMENT.md § "Get the app" CTA. */
const APP_STORE_URL = '';

const LATENCY = 1000;                                  // simulated generate / try-on delay
const IMG = (n) => `./assets/images/demo/${n}`;

const CLOSET = [
  { id: 'blue',     name: 'Navy Shirt',          brand: 'Uniqlo',           img: IMG('cut-item-blue-shirt.png') },
  { id: 'striped',  name: 'Striped White Shirt', brand: 'Charles Tyrwhitt', img: IMG('cut-item-striped-shirt.png') },
  { id: 'polo',     name: 'Burgundy Knit Polo',  brand: 'COS',              img: IMG('cut-item-burgundy-polo.png') },
  { id: 'beige',    name: 'Beige Chinos',        brand: 'Dockers',          img: IMG('cut-item-beige-chinos.png') },
  { id: 'offwhite', name: 'Off-White Chinos',    brand: 'J.Crew',           img: IMG('cut-item-offwhite-chinos.png') },
  { id: 'black-tr', name: 'Black Trousers',      brand: 'Theory',           img: IMG('cut-item-black-trousers.png') },
  { id: 'white-sh', name: 'White Sneakers',      brand: 'Common Projects',  img: IMG('cut-item-white-shoes.png') },
  { id: 'black-sh', name: 'Black Loafers',       brand: 'Meermin',          img: IMG('cut-item-black-shoes.png') },
  { id: 'brown-sh', name: 'Brown Loafers',       brand: 'Meermin',          img: IMG('cut-item-brown-shoes.png') },
];

/* Cutouts are 176×220, flat-lays 600×600, model shots 600×750 — declared on every
   <img> so the browser reserves the box and the page does not shift as they land. */
const SIZE = { item: [176, 220], flat: [600, 600], model: [600, 750] };

const OUTFITS = [
  {
    flat: IMG('outfit-smart-casual.jpg'), tryon: IMG('cut-model-casual.png'), title: 'Smart Casual',
    pieces: ['Navy Shirt', 'Beige Chinos', 'White Sneakers'],
    why: 'Nothing formal today — breathable cotton, sleeves ready to roll, nothing that needs thinking about.',
  },
  {
    flat: IMG('outfit-work.jpg'), tryon: IMG('cut-model-work.png'), title: 'The Work Fit',
    pieces: ['Striped White Shirt', 'Black Trousers', 'Black Loafers'],
    why: 'Meetings till six — crisp stripes and black leather read sharp without a jacket.',
  },
  {
    flat: IMG('outfit-party.jpg'), tryon: IMG('cut-model-party.png'), title: 'Party Wear',
    pieces: ['Burgundy Knit Polo', 'Off-White Chinos', 'Brown Loafers'],
    why: 'Dinner on the calendar — the knit polo dresses up while the chinos keep it easy.',
  },
];


/* ═══ Hooks & helpers ══════════════════════════════════════════════════════════ */

/**
 * Viewport breakpoints — see DESIGN_SYSTEM.md §14. Layout lives in inline styles
 * throughout this page, and inline styles cannot carry media queries, so the
 * breakpoints are read in JS and branched on instead.
 */
const BREAKPOINT = {
  tablet: '(max-width: 1024px)',
  mobile: '(max-width: 640px)',
  narrow: '(max-width: 480px)',   // phones proper: two closet columns stop fitting readably
};

function useBreakpoint() {
  const read = () => ({
    tablet: window.matchMedia(BREAKPOINT.tablet).matches,
    mobile: window.matchMedia(BREAKPOINT.mobile).matches,
    narrow: window.matchMedia(BREAKPOINT.narrow).matches,
  });
  const [bp, setBp] = React.useState(read);
  React.useEffect(() => {
    const mqs = Object.values(BREAKPOINT).map((q) => window.matchMedia(q));
    const sync = () => setBp(read());
    mqs.forEach((m) => m.addEventListener('change', sync));
    return () => mqs.forEach((m) => m.removeEventListener('change', sync));
  }, []);
  return bp;
}

/* Scroll offset comes from `scroll-margin-top` in styles.css, so this stays a
   one-liner and cannot drift from the nav's real height. */
const goTo = (id) => {
  const el = document.getElementById(id);
  if (!el) return;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
};

/* Where the "Get the app" CTAs point until a store URL exists. */
const appCta = APP_STORE_URL
  ? { href: APP_STORE_URL }
  : { onClick: () => goTo('get-app') };


/* ═══ Primitives ═══════════════════════════════════════════════════════════════ */

/**
 * Material Symbols Rounded glyph — mirrors Flutter's Icons.*_rounded / *_outlined.
 * Always decorative: the ligature text would otherwise be read aloud verbatim.
 */
function Icon({ name, size = 24, filled = false, color = 'currentColor', style }) {
  return (
    <span
      aria-hidden="true"
      style={{
        fontFamily: "'Material Symbols Rounded'",
        fontSize: size,
        lineHeight: 1,
        color,
        display: 'inline-block',
        fontVariationSettings: `'FILL' ${filled ? 1 : 0}, 'wght' 400, 'GRAD' 0, 'opsz' ${Math.min(48, Math.max(20, size))}`,
        userSelect: 'none',
        ...style,
      }}
    >
      {name}
    </span>
  );
}

/**
 * Primary action button — gold→brown gradient (HomePrimaryButton).
 * variant "primary" | "text".
 *
 * `disabled` is a real disabled attribute, not an opacity/pointer-events costume:
 * pointer-events: none still leaves a control in the tab order, so a keyboard user
 * could operate buttons the design considers locked.
 * Pass `href` to render an <a> instead — right-click and open-in-new-tab then work.
 */
function Button({
  label, onClick, href, variant = 'primary', ariaLabel,
  compact = false, loading = false, block = false, disabled = false, style,
}) {
  const [pressed, setPressed] = React.useState(false);
  const { mobile } = useBreakpoint();
  const inactive = disabled || loading;

  // Pointer events cover touch as well as mouse — the old mouse-only handlers meant
  // the pressed state never showed on a phone.
  const press = {
    onPointerDown: () => setPressed(true),
    onPointerUp: () => setPressed(false),
    onPointerLeave: () => setPressed(false),
    onPointerCancel: () => setPressed(false),
  };

  const external = href && /^https?:/i.test(href);
  const Tag = href && !inactive ? 'a' : 'button';
  const tagProps = href && !inactive
    ? { href, ...(external ? { target: '_blank', rel: 'noopener noreferrer' } : {}) }
    : { type: 'button', disabled: inactive };

  if (variant === 'text') {
    return (
      <Tag
        {...tagProps}
        onClick={inactive ? undefined : onClick}
        aria-label={ariaLabel}
        {...press}
        style={{
          font: 'var(--text-chip)', fontFamily: 'var(--font-ui)', color: 'var(--action)',
          background: 'none', border: 'none', textDecoration: 'none',
          cursor: inactive ? 'default' : 'pointer', whiteSpace: 'nowrap',
          padding: 'var(--space-xs) var(--space-sm)', borderRadius: 8,
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          minHeight: mobile ? 44 : undefined,   // touch hit height, §14
          opacity: inactive ? 0.45 : pressed ? 0.6 : 1,
          ...style,
        }}
      >
        {label}
      </Tag>
    );
  }

  const h = compact ? (mobile ? 44 : 36) : 46;   // never below 44 on touch, §14
  const spinner = compact ? 16 : 20;
  return (
    <Tag
      {...tagProps}
      onClick={inactive ? undefined : onClick}
      aria-label={ariaLabel}
      aria-busy={loading || undefined}
      {...press}
      style={{
        height: h,
        padding: `0 ${compact ? 'var(--space-lg)' : 'var(--space-xxl)'}`,
        width: block ? '100%' : undefined,
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', whiteSpace: 'nowrap',
        border: 'none', borderRadius: 'var(--radius-md)', textDecoration: 'none',
        cursor: inactive ? 'default' : 'pointer',
        background: pressed && !inactive ? 'var(--grad-cta-pressed)' : 'var(--grad-cta)',
        boxShadow: disabled ? 'none' : 'var(--shadow-cta)',
        opacity: disabled ? 0.45 : 1,
        color: 'var(--on-action)',
        fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: compact ? 13 : 14,
        transition: 'background .15s ease, opacity .2s ease',
        ...style,
      }}
    >
      {loading ? (
        <>
          <span className="oufy-spin" style={{
            width: spinner, height: spinner,
            borderWidth: 2, borderColor: 'var(--on-action)',
          }} />
          <span className="sr-only">Working…</span>
        </>
      ) : label}
    </Tag>
  );
}

/**
 * Quiet chip — canvas fill, hairline border, radius-sm (piece chips, context
 * chips, view affordances, season tags).
 */
function Chip({ label, icon, iconColor = 'var(--ink-muted)', muted = false, translucent = false, style }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 'var(--space-xs)',
      padding: '4px 10px',
      background: translucent ? 'var(--glass-chip)' : 'var(--canvas)',
      border: '1px solid var(--line)', borderRadius: 'var(--radius-sm)',
      fontFamily: 'var(--font-ui)', fontWeight: 600, fontSize: 12,
      color: muted ? 'var(--ink-muted)' : 'var(--ink)',
      whiteSpace: 'nowrap', ...style,
    }}>
      {icon && <Icon name={icon} size={13} color={iconColor} />}
      {label}
    </span>
  );
}

/**
 * Section header — tracked-out uppercase eyebrow + bold Jakarta title,
 * optional trailing text action (HomeSectionHeader).
 * Renders a real heading so the page has a navigable outline.
 */
function SectionHeader({ eyebrow, title, id, level = 2, actionLabel, onAction, style }) {
  const Heading = `h${level}`;
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 'var(--space-sm)', ...style }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{
          font: 'var(--text-overline)', fontFamily: 'var(--font-ui)',
          letterSpacing: 'var(--tracking-overline)', textTransform: 'uppercase',
          color: 'var(--ink-muted)',
        }}>{eyebrow}</div>
        <Heading id={id} style={{
          font: 'var(--text-title)', fontFamily: 'var(--font-ui)',
          letterSpacing: 'var(--tracking-title)', color: 'var(--ink)',
          margin: 'var(--space-xs) 0 0',
        }}>{title}</Heading>
      </div>
      {actionLabel && (
        <button type="button" onClick={onAction} style={{
          background: 'none', border: 'none', cursor: 'pointer',
          font: 'var(--text-chip)', fontFamily: 'var(--font-ui)',
          color: 'var(--action)', padding: 'var(--space-xs) var(--space-sm)',
        }}>{actionLabel}</button>
      )}
    </div>
  );
}

/** Page indicator dots. Decorative — the live region beside them carries the state. */
function PageDots({ count, current = 0, style }) {
  return (
    <div aria-hidden="true" style={{ display: 'flex', gap: 6, justifyContent: 'center', ...style }}>
      {Array.from({ length: count }, (_, i) => (
        <span key={i} style={{
          width: i === current ? 18 : 6, height: 6, borderRadius: 3,
          background: i === current ? 'var(--action)' : 'var(--line)',
          transition: 'all .25s ease',
        }} />
      ))}
    </div>
  );
}

/** The lit radial plinth every garment image sits on. */
function Stage({ children, height = 380 }) {
  return (
    <div style={{
      height, borderRadius: 'var(--radius-lg)', border: '1px solid var(--line)',
      background: 'var(--grad-stage)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 24, boxSizing: 'border-box', position: 'relative', overflow: 'hidden',
    }}>{children}</div>
  );
}

/** Busy state. role="status" so the label is announced, not just animated. */
function Thinking({ label }) {
  return (
    <div role="status" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
      <span className="oufy-spin" style={{ width: 26, height: 26, borderWidth: 3, borderColor: 'var(--action)' }} />
      <span style={{ font: '600 13px var(--font-ui)', color: 'var(--ink-muted)' }}>{label}</span>
    </div>
  );
}

/**
 * Today's Pick hero card — radial "stage" glow holding the outfit cutout,
 * solid surface info panel with title + piece chips + CTA (TodayPickPager _PickCard).
 */
function PickCard({
  src, alt = '', width, height, title, pieces = [], pieceCount,
  ctaLabel = 'Try this on', ctaAriaLabel, onCta, onOpen, stageHeight = 260, imgStyle, style,
}) {
  const count = pieceCount ?? pieces.length;
  return (
    <div style={{
      background: 'var(--surface)', border: '1px solid var(--line)',
      borderRadius: 'var(--radius-lg)', overflow: 'hidden',
      boxShadow: 'var(--shadow-card)', fontFamily: 'var(--font-ui)', ...style,
    }}>
      <div
        onClick={onOpen}
        style={{
          height: stageHeight, position: 'relative', cursor: onOpen ? 'pointer' : 'default',
          background: 'var(--grad-stage)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          padding: 'var(--space-xl)', boxSizing: 'border-box',
        }}
      >
        {src && (
          <img src={src} alt={alt} width={width} height={height} decoding="async"
            style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', ...imgStyle }} />
        )}
        {count > 0 && (
          <div style={{ position: 'absolute', top: 'var(--space-md)', left: 'var(--space-md)' }}>
            <Chip label={`${count} ${count === 1 ? 'piece' : 'pieces'}`} icon="auto_awesome" iconColor="var(--action)" muted translucent />
          </div>
        )}
        {onOpen && (
          <div style={{ position: 'absolute', top: 'var(--space-md)', right: 'var(--space-md)' }}>
            <Chip label="View" icon="open_in_full" muted />
          </div>
        )}
      </div>
      <div style={{ padding: 'var(--space-lg) var(--space-xl)' }}>
        <div style={{
          font: 'var(--text-title)', fontFamily: 'var(--font-ui)',
          letterSpacing: 'var(--tracking-title)', color: 'var(--ink)',
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>{title}</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 'var(--space-sm)', marginTop: 'var(--space-md)' }}>
          {pieces.length > 0
            ? pieces.slice(0, 3).map((p) => <Chip key={p} label={p} />)
            : <span style={{ font: 'var(--text-body-md)', fontFamily: 'var(--font-ui)', fontSize: 13, color: 'var(--ink-muted)' }}>A look from your wardrobe</span>}
        </div>
        <div style={{ marginTop: 'var(--space-lg)' }}>
          <Button label={ctaLabel} ariaLabel={ctaAriaLabel} block onClick={onCta} />
        </div>
      </div>
    </div>
  );
}


/* ═══ The interactive experience: add clothes → generate → try on ══════════════ */

function StepHeader({ n, eyebrow, title, done, id }) {
  const { mobile } = useBreakpoint();
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: mobile ? 12 : 16 }}>
      <span aria-hidden="true" style={{
        width: 44, height: 44, borderRadius: 16, flex: 'none',
        background: done ? 'var(--grad-cta)' : 'var(--surface)',
        border: done ? 'none' : '1px solid var(--line)',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        font: '800 15px var(--font-ui)', color: done ? 'var(--on-action)' : 'var(--ink-muted)',
      }}>{done ? <Icon name="check" size={20} color="var(--on-action)" /> : `0${n}`}</span>
      <div>
        <div style={{ font: 'var(--text-overline)', fontFamily: 'var(--font-ui)', letterSpacing: 'var(--tracking-overline)', textTransform: 'uppercase', color: 'var(--ink-muted)' }}>{eyebrow}</div>
        <h3 id={id} style={{ font: 'var(--text-title)', fontFamily: 'var(--font-ui)', letterSpacing: 'var(--tracking-title)', color: 'var(--ink)', margin: '2px 0 0' }}>{title}</h3>
      </div>
    </div>
  );
}

function ItemCard({ item, added, onToggle }) {
  const { mobile } = useBreakpoint();
  return (
    <button
      type="button"
      onClick={onToggle}
      aria-pressed={added}
      style={{
        display: 'flex', alignItems: 'center', gap: mobile ? 10 : 12, textAlign: 'left', cursor: 'pointer',
        minWidth: 0,   // let the card shrink inside its grid track instead of forcing it wide
        padding: mobile ? '12px 12px' : '14px 16px', borderRadius: 'var(--radius-md)',
        background: added ? 'var(--glass-item-active)' : 'var(--surface)',
        border: added ? '2px solid var(--action)' : '1px solid var(--line)',
        boxShadow: added ? 'var(--shadow-item-active)' : 'none',
        fontFamily: 'var(--font-ui)', transition: 'all .2s ease',
      }}
    >
      <span style={{
        width: mobile ? 40 : 46, height: mobile ? 40 : 46, borderRadius: 14, flex: 'none',
        background: 'var(--tile)', border: '1px solid var(--line)',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        padding: 4, boxSizing: 'border-box', overflow: 'hidden',
      }}>
        {/* alt="" — the name and brand sit right beside it as real text. */}
        <img src={item.img} alt="" width={SIZE.item[0]} height={SIZE.item[1]}
          loading="lazy" decoding="async"
          style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }} />
      </span>
      <span style={{ flex: 1, minWidth: 0 }}>
        <span style={{ display: 'block', font: '700 13px var(--font-ui)', color: 'var(--ink)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.name}</span>
        <span style={{ display: 'block', font: '500 11px var(--font-ui)', color: 'var(--ink-muted)', marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.brand}</span>
      </span>
      <span aria-hidden="true" style={{
        width: 24, height: 24, borderRadius: 12, flex: 'none',
        background: added ? 'var(--action)' : 'var(--canvas)',
        border: added ? 'none' : '1px solid var(--border)',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      }}>{added ? <Icon name="check" size={15} color="var(--on-action)" /> : <Icon name="add" size={15} color="var(--ink-muted)" />}</span>
    </button>
  );
}

function Experience() {
  const { tablet, mobile, narrow } = useBreakpoint();
  const indent = mobile ? 0 : 60;          // §14: step content loses its indent on mobile
  const stage = mobile ? 280 : 340;
  const [added, setAdded] = React.useState([]);
  const [revealed, setRevealed] = React.useState(0);   // how many outfits generated
  const [current, setCurrent] = React.useState(0);     // outfit in view
  const [generating, setGenerating] = React.useState(false);
  const [tried, setTried] = React.useState([]);        // outfit indexes tried on
  const [trying, setTrying] = React.useState(false);

  const allAdded = added.length === CLOSET.length;
  const toggle = (id) => setAdded((a) => a.includes(id) ? a.filter((x) => x !== id) : [...a, id]);

  // Start the fetch on click, not when the <img> mounts — the spinner then covers the download.
  const preload = (src) => { new Image().src = src; };

  const generate = () => {
    if (generating || revealed >= OUTFITS.length) return;
    preload(OUTFITS[revealed].flat);
    setGenerating(true);
    setTimeout(() => {
      setCurrent(revealed);
      setRevealed(revealed + 1);
      setGenerating(false);
    }, LATENCY);
  };

  const tryOn = () => {
    if (trying || tried.includes(current)) return;
    preload(OUTFITS[current].tryon);
    setTrying(true);
    setTimeout(() => {
      setTried((t) => [...t, current]);
      setTrying(false);
    }, LATENCY);
  };

  const outfit = revealed > 0 ? OUTFITS[current] : null;
  const isTried = !!outfit && tried.includes(current);
  const allStyled = revealed >= OUTFITS.length;

  // Step 2 is gated on step 1. `inert` removes the whole subtree from the tab order
  // and the accessibility tree; the buttons are also genuinely disabled, so the gate
  // still holds on the rare engine without inert support.
  const locked = !allAdded;

  return (
    <section id="experience" aria-labelledby="experience-heading" style={{ maxWidth: 1080, margin: '0 auto', padding: mobile ? '64px 20px 32px' : '88px 24px 40px', display: 'flex', flexDirection: 'column', gap: mobile ? 48 : 72 }}>
      <h2 id="experience-heading" className="sr-only">Try Oufy yourself</h2>

      {/* ── Step 1: add clothes ── */}
      <div data-screen-label="Step 1 — Add clothes">
        <StepHeader n={1} eyebrow="Step one" title="Add your clothes" done={allAdded} id="step-1" />
        <p style={{ font: 'var(--text-prose)', fontSize: 15, color: 'var(--ink-muted)', maxWidth: 480, margin: `14px 0 0 ${indent}px` }}>
          Your closet, catalogued. Tap the pieces to add them — nine pieces are enough for a week of looks.
        </p>
        {/* minmax(0,…) not 1fr: a bare 1fr track keeps its content's min-content width and overflows. */}
        <div
          role="group"
          aria-labelledby="step-1"
          style={{ display: 'grid', gridTemplateColumns: `repeat(${narrow ? 1 : tablet ? 2 : 3}, minmax(0, 1fr))`, gap: 12, margin: `24px 0 0 ${indent}px` }}
        >
          {CLOSET.map((it) => <ItemCard key={it.id} item={it} added={added.includes(it.id)} onToggle={() => toggle(it.id)} />)}
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 16, margin: `20px 0 0 ${indent}px` }}>
          <Button
            label={allAdded ? 'Wardrobe ready' : 'Add all nine'}
            compact
            disabled={allAdded}
            onClick={() => setAdded(CLOSET.map((i) => i.id))}
          />
          <span aria-live="polite" style={{ font: '600 12px var(--font-ui)', color: 'var(--ink-muted)' }}>{added.length} of {CLOSET.length} added</span>
        </div>
      </div>

      {/* ── Step 2 + 3: generate & try on ── */}
      <div
        data-screen-label="Step 2 — Generate"
        inert={locked ? '' : undefined}
        style={{ opacity: locked ? 0.35 : 1, transition: 'opacity .4s ease' }}
      >
        <StepHeader n={2} eyebrow="Step two" title="Generate today's look" done={allStyled} id="step-2" />
        <p style={{ font: 'var(--text-prose)', fontSize: 15, color: 'var(--ink-muted)', maxWidth: 480, margin: `14px 0 0 ${indent}px` }}>
          {allAdded ? 'Your stylist reads your day and the occasion, then builds looks from what you own.' : 'Add your clothes first — your stylist works only with what you own.'}
        </p>

        {/* One announcement for both cards, so a screen reader hears what changed. */}
        <p className="sr-only" aria-live="polite">
          {generating ? 'Styling your look.'
            : trying ? 'Fitting the look on you.'
            : outfit ? `Showing look ${current + 1} of ${revealed}: ${outfit.title}. ${outfit.pieces.join(', ')}. ${outfit.why}${isTried ? ' Try-on ready.' : ''}`
            : ''}
        </p>

        <div style={{ display: 'grid', gridTemplateColumns: tablet ? 'minmax(0, 1fr)' : 'repeat(2, minmax(0, 1fr))', gap: 20, margin: `24px 0 0 ${indent}px`, alignItems: 'stretch' }}>
          {/* The look */}
          <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 'var(--radius-lg)', padding: 16, boxShadow: 'var(--shadow-card)' }}>
            <Stage height={stage}>
              {generating ? <Thinking label="Styling…" />
                : outfit ? <img key={outfit.flat} className="oufy-fadein" src={outfit.flat} alt={`${outfit.title} laid out flat: ${outfit.pieces.join(', ')}`} width={SIZE.flat[0]} height={SIZE.flat[1]} decoding="async" style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', mixBlendMode: 'multiply' }} />
                : <span style={{ font: '600 13px var(--font-ui)', color: 'var(--ink-muted)' }}>Your first look lands here</span>}
              {outfit && !generating && (
                <div style={{ position: 'absolute', top: 12, left: 12 }}>
                  <Chip label={`${outfit.pieces.length} pieces`} icon="auto_awesome" iconColor="var(--action)" muted translucent />
                </div>
              )}
            </Stage>
            <div style={{ padding: '14px 6px 6px' }}>
              {outfit && !generating ? (
                <div className="oufy-fadein">
                  <div style={{ font: 'var(--text-title)', fontFamily: 'var(--font-ui)', letterSpacing: 'var(--tracking-title)', color: 'var(--ink)' }}>{outfit.title}</div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 10 }}>
                    {outfit.pieces.map((p) => <Chip key={p} label={p} />)}
                  </div>
                  <p style={{ font: '400 13px/1.5 var(--font-ui)', color: 'var(--ink-muted)', margin: '12px 0 0' }}>
                    <Icon name="auto_awesome" size={13} color="var(--action)" style={{ verticalAlign: '-2px', marginRight: 5 }} />{outfit.why}
                  </p>
                </div>
              ) : (
                <div style={{ font: '500 13px var(--font-ui)', color: 'var(--ink-muted)' }}>{generating ? 'Reading your day, checking the occasion…' : 'Nothing generated yet'}</div>
              )}
              <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 14, marginTop: 16 }}>
                <Button
                  label={revealed === 0 ? 'Generate' : allStyled ? 'All three styled' : 'Generate another'}
                  loading={generating}
                  disabled={locked || allStyled}
                  onClick={generate}
                />
                {revealed > 1 && <PageDots count={revealed} current={current} />}
                {revealed > 1 && (
                  <button
                    type="button"
                    onClick={() => setCurrent((current + 1) % revealed)}
                    aria-label="Cycle through your generated looks"
                    style={{ background: 'none', border: 'none', cursor: 'pointer', whiteSpace: 'nowrap', font: 'var(--text-chip)', fontFamily: 'var(--font-ui)', color: 'var(--action)' }}
                  >Previous looks</button>
                )}
              </div>
            </div>
          </div>

          {/* The try-on */}
          <div data-screen-label="Step 3 — Try on" style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 'var(--radius-lg)', padding: 16, boxShadow: 'var(--shadow-card)', display: 'flex', flexDirection: 'column' }}>
            <h3 className="sr-only">Step three — see it on you</h3>
            <Stage height={stage}>
              {trying ? <Thinking label="Fitting it on you…" />
                : isTried ? <img key={outfit.tryon} className="oufy-fadein" src={outfit.tryon} alt={`A model wearing ${outfit.title}: ${outfit.pieces.join(', ')}`} width={SIZE.model[0]} height={SIZE.model[1]} decoding="async" style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain' }} />
                : (
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
                    <Icon name="accessibility_new" size={40} color="var(--ink-tertiary)" />
                    <span style={{ font: '600 13px var(--font-ui)', color: 'var(--ink-muted)' }}>{outfit ? 'See it on a body, not a bed' : 'Generate a look first'}</span>
                  </div>
                )}
              {isTried && !trying && (
                <div style={{ position: 'absolute', top: 12, right: 12 }}>
                  <Chip label="AI try-on" icon="auto_awesome" iconColor="var(--action)" muted translucent />
                </div>
              )}
            </Stage>
            <div style={{ padding: '14px 6px 6px', marginTop: 'auto' }}>
              <p style={{ font: '400 13px/1.5 var(--font-ui)', color: 'var(--ink-muted)', margin: '0 0 14px' }}>
                {isTried ? 'That settles it — hang it back or wear it out.' : 'One tap shows the whole look on your photo before you commit.'}
              </p>
              <Button
                label={isTried ? 'Looks right' : 'Try this on'}
                loading={trying}
                disabled={locked || !outfit || isTried}
                onClick={tryOn}
              />
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}


/* ═══ Page sections ════════════════════════════════════════════════════════════ */

            Add the clothes you own. Get a look for today, with the reasoning to see why. Try it on before you get dressed. Walk through it below — for real.
          </p>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 14, alignItems: 'center', marginTop: mobile ? 26 : 32 }}>
            <Button label="Try the demo" onClick={() => goTo('experience')} />
            <Button label="See what it does" variant="text" onClick={() => goTo('features')} />
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: mobile ? 22 : 28 }}>
            <Chip label="Outfit canvas" icon="design_services" iconColor="var(--action)" muted translucent />
            <Chip label="Explainable picks" icon="auto_awesome" iconColor="var(--action)" muted translucent />
            <Chip label="Virtual try-on" icon="checkroom" iconColor="var(--action)" muted translucent />
          </div>
        </div>
        <div style={{ maxWidth: 360, justifySelf: 'center', width: '100%' }}>
          <PickCard
            src={IMG('outfit-smart-casual.jpg')}
            alt="Today's pick laid out flat: a navy shirt, beige chinos and white sneakers."
            width={SIZE.flat[0]} height={SIZE.flat[1]}
            title="Smart Casual"
            pieces={['Navy Shirt', 'Beige Chinos', 'White Sneakers']}
            stageHeight={250}
            imgStyle={{ mixBlendMode: 'multiply' }}
            ctaLabel="Try this on"
            /* Step 3 has a button with this same visible label that does the actual
               try-on. Keeping the visible text (WCAG 2.5.3) but extending the
               accessible name keeps the two distinguishable in a button list. */
            ctaAriaLabel="Try this on — open the interactive demo"
            onCta={() => goTo('experience')}
          />
        </div>
      </div>
    </header>
  );
}

function Features() {
  const { mobile } = useBreakpoint();
  const items = [
    ['auto_awesome', 'Daily outfit recommendations',
     'A look put together for you each morning, built from the pieces already hanging in your wardrobe — with the reasoning, so you can see why it works before you wear it.'],
    ['photo_camera', 'Virtual try-on',
     'See a look on your own photo instead of guessing. The whole outfit, on a body rather than laid out on a bed, before you commit to it.'],
    ['design_services', 'The outfit canvas',
     'Style it yourself when you already have an idea. Drag, swap and rearrange pieces until the look is right, then try the result on.'],
  ];
  return (
    <section id="features" aria-labelledby="features-heading" style={{ maxWidth: 1080, margin: '0 auto', padding: mobile ? '56px 20px' : '72px 24px' }}>
      <SectionHeader eyebrow="Features" title="Everything Oufy does" id="features-heading" />
      {/* The one grid on this page that needs no breakpoint branching: auto-fit with a
          minmax floor resolves to 3 / 2 / 1 columns intrinsically as the container
          narrows, which inline styles CAN express (it is sizing, not a media query). */}
      <ul style={{
        display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))',
        gap: mobile ? 14 : 20, margin: '28px 0 0', padding: 0, listStyle: 'none',
      }}>
        {items.map(([icon, title, body]) => (
          <li key={title} style={{
            background: 'var(--surface)', border: '1px solid var(--line)',
            borderRadius: 'var(--radius-lg)', padding: mobile ? '22px 20px' : '26px 24px',
            boxShadow: 'var(--shadow-glass)',
            display: 'flex', flexDirection: 'column', gap: 14,
          }}>
            <span aria-hidden="true" style={{
              width: 44, height: 44, borderRadius: 14, flex: 'none',
              background: 'var(--canvas)', border: '1px solid var(--line)',
              display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <Icon name={icon} size={22} color="var(--action)" />
            </span>
            <span>
              <h3 style={{ font: '700 16px var(--font-ui)', letterSpacing: '-0.2px', color: 'var(--ink)', margin: 0 }}>{title}</h3>
              <span style={{ display: 'block', font: '400 14px/1.6 var(--font-ui)', color: 'var(--ink-muted)', marginTop: 8 }}>{body}</span>
            </span>
          </li>
        ))}
      </ul>
    </section>
  );
}

function GetApp() {
  const { tablet, mobile } = useBreakpoint();
  return (
    <section id="get-app" aria-labelledby="get-app-heading" style={{ position: 'relative', overflow: 'hidden', marginTop: 24 }}>
      <div aria-hidden="true" style={{ position: 'absolute', inset: 0, background: 'var(--grad-mesh-base)' }}>
        <div className="blob blob-b" style={{ left: '18%', top: '-40%', width: 360, height: 360, background: 'rgba(212,160,96,.4)' }}></div>
        <div className="blob blob-a" style={{ right: '10%', bottom: '-50%', width: 400, height: 400, background: '#F6E3BE' }}></div>

        <h2 id="get-app-heading" style={{ font: `500 ${mobile ? 30 : tablet ? 34 : 40}px/1.15 var(--font-display)`, margin: 0 }}>Get dressed with intention</h2>
        <p style={{ font: 'var(--text-prose)', fontSize: mobile ? 15 : 16, color: 'var(--ink-muted)', margin: '16px auto 0', maxWidth: 440 }}>Start with the pieces you already own.</p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 14, justifyContent: 'center', marginTop: 28 }}>

          <Button label="Try the demo again" variant="text" onClick={() => goTo('experience')} />
        </div>

}

function Footer() {

  return (

      <div style={{ maxWidth: 1080, margin: '0 auto', padding: mobile ? '24px 20px' : '28px 24px', display: 'flex', alignItems: 'center', gap: mobile ? 12 : 24 }}>
        <span style={{ font: '800 16px var(--font-ui)', letterSpacing: '-0.4px' }}>Oufy</span>
        <span style={{ flex: 1 }}></span>
        {/* Relative, not root-absolute, so these work from file:// too. */}
        {[['Privacy', './privacy.html'], ['Terms', './terms.html']].map(([label, href]) => (

function Landing() {

      <Nav />
      <main id="main">
        <Hero />
        <Experience />
        <Features />
        <GetApp />
      </main>
      <Footer />

}

ReactDOM.createRoot(document.getElementById('root')).render(<Landing />);
</script>

<!-- Plain JS, so it still runs if Babel itself failed to load: the page depends on three
     CDN files, and a blank cream screen is the worst possible failure. If nothing has
     mounted after 8s, say something useful instead. -->
<script>
setTimeout(function () {
  var root = document.getElementById('root');
  if (root && root.childElementCount === 0) {
    root.innerHTML =
      '<div class="fallback">' +
        '<h1>Oufy</h1>' +
        '<p>This page could not finish loading — its React and Babel scripts come from a CDN ' +
        'that is not reachable right now.</p>' +
        '<p>Check your connection and reload.</p>' +
      '</div>';
  }
}, 8000);
</script>
